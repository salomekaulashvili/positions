<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="product-card">

            <div class="product-image">

                <img class="main-image"
                     src="./img/download__9_-removebg-preview.png"
                     alt="Ice Cream">

                <div class="product-images">
                    <img src="./img/Delicious_Chocolate_Ice_Cream_Scoop__Ice_Cream_Scoop__Chocolate_Ice_Cream_Scoop__Ice_Cream_PNG_Transparent_Image_and_Clipart_for_Free_Download-removebg-preview.png" alt="Ice Cream 1">
                    <img src="./img/download__6_-removebg-preview (1).png" alt="Ice Cream 2">
                    <img src="./img/Top_view_of_violet_creamy_ice_cream_ball_on_transparent_background___Premium_AI-generated_PSD-removebg-preview.png" alt="Ice Cream 3">
                    <img src="./img/_배스킨라빈스__아이스크림-removebg-preview.png" alt="Ice Cream 4">
                </div>

            </div>

            <div class="product-info">

                <h2>Delicious Ice Cream</h2>

                <p class="product-code">COD: 45999</p>

                <p class="price">$7.93</p>

                <div class="product-flavors">

                    <p>Select a Flavor</p>

                    <div class="flavor-images">
                        <img src="./img/3D_Ice-cream_Raspberry_Pistachio_Nuts_Cacao_-_Victor_Besko-removebg-preview.png" alt="Flavor 1">
                        <img src="./img/download__7_-removebg-preview.png" alt="Flavor 2">
                        <img src="./img/download__8_-removebg-preview.png" alt="Flavor 3">
                        <img src="./img/Delicious_Ice_Cream_Sundae_With_Strawberries_And_Blueberries_PNG_Free_Download-removebg-preview.png" alt="Flavor 4">
                    </div>

                </div>

                <div class="product-benefits">

                    <p>BENEFITS</p>

                    <ul>
                        <li>Made with fresh ingredients</li>
                        <li>Delicious and creamy taste</li>
                        <li>Perfect for summer days</li>
                        <li>Available in different flavors</li>
                    </ul>

                </div>

                <button class="cart-button">
                    ADD TO CART
                </button>

            </div>

        </div>

    </div>

</body>
</html>
